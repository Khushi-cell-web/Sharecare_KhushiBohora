# Stable Android build memory settings (better for low-RAM machines).
# Keep Gradle heap lower so the JVM has room for native memory and compiler threads.
org.gradle.jvmargs=-Xms256m -Xmx1024m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=2 -Xss512k -XX:HeapBaseMinAddress=1G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Auto-download JDK 17 if not found (Gradle toolchain)
org.gradle.java.installations.auto-download=true

# Build stability/performance
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.workers.max=1

# Kotlin settings
kotlin.daemon.enabled=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process